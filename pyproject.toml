[project]
name = "project-atlas"
version = "0.1.0"
description = "Project Atlas Report Copilot API powered by FastAPI, LangGraph, and ChromaDB"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-multipart>=0.0.9",
    "langgraph>=0.2.0",
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-google-genai>=1.0.0",
    "chromadb>=0.5.0",
    "tiktoken>=0.7.0",
    "mysql-connector-python>=8.4.0",
    "pymysql>=1.1.0",
    "sqlalchemy>=2.0.0",
    "cryptography>=42.0.0",
    "langfuse>=2.38.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "reportlab>=5.0.1",
    "pymupdf>=1.28.2",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["api/app"]

[tool.pyright]
extraPaths = ["api"]
venvPath = "."
venv = ".venv"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
