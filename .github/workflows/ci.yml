name: Project Atlas CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password_ci
          MYSQL_DATABASE: project_atlas
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 --silent" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, mysqli, pdo_mysql, curl

      - name: Lint PHP files
        run: |
          find portal -name "*.php" -exec php -l {} \;

      - name: Initialize MySQL Schema and Roles
        run: |
          mysql -h 127.0.0.1 -u root -proot_password_ci project_atlas < docker/mysql/init.sql
          MYSQL_HOST="127.0.0.1" \
          MYSQL_DATABASE="project_atlas" \
          MYSQL_ROOT_PASSWORD="root_password_ci" \
          MYSQL_USER="atlas_app" \
          MYSQL_PASSWORD="atlas_app_password" \
          MYSQL_READONLY_USER="atlas_readonly" \
          MYSQL_READONLY_PASSWORD="atlas_ro_password" \
          sh docker/mysql/create-readonly-user.sh

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir ".[dev]" pytest pytest-asyncio

      - name: Run Test Suite with Live MySQL Integration Tests
        env:
          API_KEY: "ci-secret-api-key"
          ATLAS_MYSQL_INTEGRATION_TESTS: "1"
          ATLAS_MYSQL_TEST_HOST: "127.0.0.1"
          ATLAS_MYSQL_TEST_PORT: "3306"
          ATLAS_MYSQL_TEST_DATABASE: "project_atlas"
          ATLAS_MYSQL_TEST_READONLY_USER: "atlas_readonly"
          ATLAS_MYSQL_TEST_READONLY_PASSWORD: "atlas_ro_password"
          GROQ_API_KEY: "mock-groq-key-ci"
        run: |
          python -m pytest -v api/tests/
